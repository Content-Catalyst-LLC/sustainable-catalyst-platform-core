services:
  core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sc-core
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      PORT: "8090"

    networks:
      - sc-internal

    ports:
      - "127.0.0.1:8090:8090"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  connector-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sc-core-connector-worker
    restart: unless-stopped

    env_file:
      - .env.production

    command:
      - python
      - scripts/run_connector_worker.py
      - --idle-seconds
      - "2"

    networks:
      - sc-internal

    depends_on:
      core:
        condition: service_healthy


  connector-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sc-core-connector-scheduler
    restart: unless-stopped

    env_file:
      - .env.production

    command:
      - python
      - -m
      - scripts.run_connector_scheduler
      - --poll-seconds
      - "60"

    networks:
      - sc-internal

    depends_on:
      core:
        condition: service_healthy

networks:
  sc-internal:
    external: true
    name: sc-internal
